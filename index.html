<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <img class="splitter-logo" src="./images/logo.svg" alt="Splitter Logo" />
    <div class="container">
      <div class="calculator-contents-container">
        <div class="bill-container">
          <p class="bill-text">Bill</p>
          <input type="text" placeholder="0" />
        </div>
        <div class="select-tip-container"></div>
        <div class="number-of-people-container"></div>
      </div>
      <div class="calculator-results-container">
        <div class="tip-amount-container"></div>
        <div class="total-container"></div>
        <div class="reset-button-container"></div>
      </div>
    </div>
    <script src="./script.js"></script>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.frontendmentor.io/profile/Joseph2909" target="_blank"
        >Joseph Omoruyi</a
      >.
    </footer>
  </body>
</html>
